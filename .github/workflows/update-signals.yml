name: Update crisis signals

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
  push:
    branches: [ main ]
    paths:
      - 'scripts/update_signals.py'
      - '.github/workflows/update-signals.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Fetch and classify signals
        run: python scripts/update_signals.py
      - name: Commit feed if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add signals.json
          if git diff --cached --quiet; then
            echo "No feed changes"
          else
            git commit -m "Update crisis signals"
            git push
          fi
